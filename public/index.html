<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Favicon -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#4F7DF3" />

    <!-- SEO -->
    <title>Mansi Nair | Portfolio</title>

    <meta
      name="description"
      content="Portfolio of Mansi Nair – MCA student with experience in Frontend Development, Project Coordination, Business Analysis, and Data-driven problem solving."
    />

    <meta
      name="keywords"
      content="Mansi Nair, Portfolio, MCA, Frontend Developer, React Developer, Business Analyst, Project Coordinator, Web Developer, JavaScript, React.js"
    />

    <meta name="author" content="Mansi Nair" />

    <!-- Open Graph (LinkedIn, WhatsApp, Facebook) -->
    <meta property="og:type" content="website" />

    <meta property="og:title" content="Mansi Nair | Portfolio" />

    <meta
      property="og:description"
      content="Explore my portfolio showcasing projects, internship experience, technical skills, certifications, and professional journey."
    />

    <!-- Replace this after deployment -->
    <meta
      property="og:url"
      content="https://your-portfolio.vercel.app/"
    />

  
    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Mansi Nair | Portfolio"
    />

    <meta
      name="twitter:description"
      content="Portfolio of MCA student passionate about Business Analysis, Project Coordination, Frontend Development, and Technology."
    />


    <!-- Apple -->
    <link
      rel="apple-touch-icon"
      href="%PUBLIC_URL%/logo192.png"
    />

    <!-- Manifest -->
    <link
      rel="manifest"
      href="%PUBLIC_URL%/manifest.json"
    />
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>

    <div id="root"></div>
  </body>
</html>
